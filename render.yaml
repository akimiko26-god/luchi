# ЛУЧИ — Render Blueprint
# Dashboard: New → Blueprint → репозиторий akimiko26-god/luchi

databases:
  - name: luchi-db
    plan: free
    postgresMajorVersion: '16'
    region: frankfurt
    databaseName: luchi
    user: luchi

services:
  - type: web
    name: luchi-api
    runtime: node
    plan: free
    region: frankfurt
    autoDeployTrigger: commit
    buildCommand: NPM_CONFIG_PRODUCTION=false npm ci && npx prisma generate --schema=apps/api/prisma/schema.prisma && npm run build -w @luchi/api
    startCommand: npm run start:prod -w @luchi/api
    preDeployCommand: npm run render:predeploy
    initialDeployHook: npm run render:seed
    healthCheckPath: /api/v1/health
    envVars:
      - fromGroup: luchi-node
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: luchi-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        fromService:
          name: luchi-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ADMIN_ORIGIN
        fromService:
          name: luchi-admin
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: luchi-web
    runtime: node
    plan: free
    region: frankfurt
    autoDeployTrigger: commit
    buildCommand: NPM_CONFIG_PRODUCTION=false npm ci && node scripts/render-web-build.cjs
    startCommand: npm run start -w @luchi/web
    envVars:
      - fromGroup: luchi-node
      - key: NODE_ENV
        value: production
      - key: API_ORIGIN
        fromService:
          name: luchi-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ADMIN_ORIGIN
        fromService:
          name: luchi-admin
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: luchi-admin
    runtime: node
    plan: free
    region: frankfurt
    autoDeployTrigger: commit
    buildCommand: NPM_CONFIG_PRODUCTION=false npm ci && node scripts/render-admin-build.cjs
    startCommand: npm run start -w @luchi/admin
    envVars:
      - fromGroup: luchi-node
      - key: NODE_ENV
        value: production
      - key: API_ORIGIN
        fromService:
          name: luchi-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

envVarGroups:
  - name: luchi-node
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: NPM_CONFIG_PRODUCTION
        value: 'false'
