name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: luchi_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/luchi_test
      REDIS_URL: redis://localhost:6379
      API_PORT: 3001
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Init DB schemas
        run: psql $DATABASE_URL -f scripts/migrate/001_init_schemas.sql

      - name: Generate Prisma client
        run: npm run db:generate --workspace=apps/api

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit --workspace=apps/api

      - name: Build
        run: npm run build
